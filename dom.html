<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Vibes - Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music"></i>JustVibe
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i> Home</a>
                <a href="#" class="nav-link"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
                <a href="#" class="nav-link"><i class="fa-solid fa-book-open"></i> Your Library</a>
            </nav>
            <div class="sidebar-bottom">
                <a href="admin.html" class="nav-link admin-link"><i class="fa-solid fa-gear"></i> Admin Panel</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search for songs, artists, or albums...">
                </div>
                <div class="user-profile">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <div class="content-wrapper">
                <h2 class="section-title">Discover</h2>

                <div id="loadingState" class="state-message hidden">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Loading songs...
                </div>

                <div id="emptyState" class="state-message hidden">
                    No songs found. Head to the Admin panel to add some!
                </div>

                <div class="song-grid" id="songGrid"><div class="song-card " data-index="0" style="animation-delay: 0s;">
            <div class="card-image-container">
                <img src="https://res.cloudinary.com/hpel6zlw/image/upload/v1790312823/VEDAN_Rapper_and_songwriter.jpg" alt="Bumm Baa Diga Cover" loading="lazy" width="400" height="400" onerror="this.onerror=null; this.src='https://placehold.co/400x400/1a1a1a/444444?text=Music'">
                <div class="card-play-btn">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>
            <div class="card-title">Bumm Baa Diga</div>
            <div class="card-artist">Vedan</div>
        </div></div>
            </div>
        </main>
    </div>

    <!-- Sticky Bottom Player -->
    <div class="music-player">
        <div class="now-playing">
            <img src="https://placehold.co/60x60/1a1a1a/444444?text=+" alt="Cover" id="playerCover" class="player-cover">
            <div class="track-info">
                <div class="track-title" id="playerTitle">No track selected</div>
                <div class="track-artist" id="playerArtist">-</div>
            </div>
        </div>

        <div class="player-controls-container">
            <div class="player-controls">
                <button class="control-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn play-btn" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
                <button class="control-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span class="time-display" id="currentTimeDisplay">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
                <span class="time-display" id="durationDisplay">0:00</span>
            </div>
        </div>

        <div class="volume-container">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
            <input type="range" class="volume-bar" id="volumeBar" value="100" min="0" max="100">
        </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav">
        <a href="#" class="mobile-nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="mobile-nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a>
        <a href="admin.html" class="mobile-nav-item"><i class="fa-solid fa-gear"></i><span>Admin</span></a>
    </nav>

    <!-- Audio Element -->
    <audio id="audioElement" preload="none"></audio>

    <script src="script.js"></script>


</body></html>
